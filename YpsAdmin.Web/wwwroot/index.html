<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YpsAdmin - Transit & YPS Management</title>
    <base href="/" />
    
    <!-- Google Fonts: Padauk (Myanmar), JetBrains Mono (Numbers) & Noto Sans Myanmar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="YpsAdmin.Web.styles.css" rel="stylesheet" />
    <script>
        window.YpsTheme = {
            getTheme: function() {
                try {
                    return localStorage.getItem('yps_theme') || 'dark';
                } catch (e) {
                    return 'dark';
                }
            },
            setTheme: function(theme) {
                try {
                    localStorage.setItem('yps_theme', theme);
                } catch (e) {}
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        };

        window.YpsStorage = {
            getItem: function(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return null;
                }
            },
            setItem: function(key, val) {
                try {
                    localStorage.setItem(key, val);
                } catch (e) {}
            }
        };

        // Immediate theme initialization
        (function() {
            try {
                var theme = window.YpsTheme.getTheme();
                window.YpsTheme.setTheme(theme);
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>

<body class="bg-background text-foreground font-sans antialiased selection:bg-brand selection:text-white dark:selection:text-zinc-950">
    <div id="app">
        <div class="flex min-h-screen items-center justify-center bg-background">
            <div class="text-center p-6 bg-card border border-border rounded-lg shadow-sm max-w-sm">
                <div class="w-8 h-8 border-4 border-secondary border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
                <h2 class="text-lg font-semibold text-foreground">YPS Admin Platform</h2>
                <p class="text-sm text-muted-foreground mt-1">Loading application data...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/route-map.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
